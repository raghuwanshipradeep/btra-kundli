<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <style>{{ css }}</style>
    {% if brand_footer and brand_footer.enabled %}
    <style>
    @page {
        @bottom-left {
            content: "{{ brand_footer.name }}{% if brand_footer.phone %} | {{ brand_footer.phone }}{% endif %}";
            font-family: 'Crimson Pro', serif;
            font-size: 7.5pt;
            font-weight: 600;
            color: #8B0000;
        }
        @bottom-right {
            content: "{{ brand_footer.url }}";
            font-family: 'Crimson Pro', serif;
            font-size: 7.5pt;
            font-weight: 600;
            color: #8B0000;
        }
    }
    @page cover {
        @bottom-left { content: none; }
        @bottom-right { content: none; }
    }
    @page divider {
        @bottom-left { content: none; }
        @bottom-right { content: none; }
    }
</style>
    {% endif %}
</head>
<body>
{% for section_html in sections %}
{{ section_html }}
{% endfor %}
</body>
</html>
