<div class="section-page">
  <h2 class="section-header">{{ locale.varshaphal_title }}</h2>

  {% if narrative %}
  <div class="report-card" style="margin-bottom: 5mm; border-left: 3px solid #D4AF37;">
    {% for para in narrative.split('\n') if para.strip() %}
    <p style="font-size: 12.5pt; line-height: 1.7; text-align: justify; margin: 0 0 3mm 0;">{{ para.strip() }}</p>
    {% endfor %}
  </div>
  {% endif %}

  {% include "partials/section_disclaimer.html" %}
</div>
