<div class="section-page">
  <h2 class="section-header">{{ locale.north_chart_title }}</h2>
  <p>{{ locale.north_chart_desc }}</p>

  <div style="text-align: center; margin: 5mm auto;">
    <svg viewBox="0 0 400 400" width="350" height="350"
         xmlns="http://www.w3.org/2000/svg"
         style="background: #FFFDF5;">

      <!-- outer square -->
      <rect x="0" y="0" width="400" height="400"
            fill="none" stroke="#C9A84C" stroke-width="2"/>

      <!-- diagonals -->
      <line x1="0" y1="0" x2="400" y2="400" stroke="#C9A84C" stroke-width="1"/>
      <line x1="400" y1="0" x2="0" y2="400" stroke="#C9A84C" stroke-width="1"/>

      <!-- inner diamond -->
      <polygon points="200,0 400,200 200,400 0,200"
               fill="none" stroke="#C9A84C" stroke-width="1.5"/>

      {% for h in houses %}
      <!-- House {{ h.house }} -->
      <text x="{{ h.cx }}" y="{{ h.cy - 6 }}"
            text-anchor="middle" dominant-baseline="auto"
            font-size="9" fill="#888"
            font-family="'Noto Sans Devanagari', sans-serif">
        {{ h.sign_name }}
      </text>
      {% if h.planets %}
      <text x="{{ h.cx }}" y="{{ h.cy + 10 }}"
            text-anchor="middle" dominant-baseline="auto"
            font-size="11" fill="#C9A84C" font-weight="bold"
            font-family="'Noto Sans Devanagari', sans-serif">
        {{ h.planets | join(' ') }}
      </text>
      {% endif %}
      {% if h.house == 1 %}
      <text x="{{ h.cx }}" y="{{ h.cy + 24 }}"
            text-anchor="middle" dominant-baseline="auto"
            font-size="8" fill="#888" font-style="italic">
        {% if lang == 'hi' %}लग्न{% else %}Asc{% endif %}
      </text>
      {% endif %}
      {% endfor %}
    </svg>
  </div>
</div>
