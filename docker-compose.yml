services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Must match the recovery volume mount below (DEPLOYMENT.md §6). The paid flow
      # writes a PDF here when its Drive upload fails, so it survives redeploys.
      - DRIVE_RECOVERY_DIR=/app/recovery
      # Cache DB lives INSIDE the mounted directory. Never mount a volume onto the
      # .db file path itself — named volumes are directories, which silently breaks
      # SQLite (0% cache hits, full Anthropic spend every report).
      - NARRATIVE_CACHE_PATH=/app/data/narrative_cache.db
    volumes:
      - narrative_cache:/app/data
      - recovery:/app/recovery
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Backstop only (not a reservation): a runaway spike kills this container, not the box.
    mem_limit: 3g

  # Standalone sheet_orders sweeper: reads pending rows -> generates PDF -> archives to Drive.
  # Same image as `app` (Pango/Cairo already installed), just a different command; no HTTP port.
  # IMPORTANT: run EXACTLY ONE instance — the no-double-generation guarantee is an in-process
  # lock (sheet_worker._SHEET_WORKER_LOCK), so never scale/replicate this service.
  # Its own narrative-cache volume avoids two containers writing the same SQLite file.
  # SHEET_SWEEPER_ENABLED=false keeps it idle instead of removing the service — but env is read
  # once at import, so apply it with `up -d --force-recreate sweeper`, NOT `restart` (which
  # reuses the container's existing env and would silently keep the old value). Same for
  # CREDIT_CHECK_ENABLED, the credit-gate rollback switch.
  sweeper:
    build: .
    command: python run_sweeper.py
    env_file:
      - .env
    environment:
      - NARRATIVE_CACHE_PATH=/app/data/narrative_cache.db
      - SWEEPER_HEARTBEAT_FILE=/tmp/sweeper_heartbeat
    volumes:
      - sweeper_narrative_cache:/app/data
    restart: unless-stopped
    # Liveness = heartbeat file age. The sweeper touches it every tick and after every
    # processed order; 1800s covers the worst legitimate gap (600s generation timeout
    # + up to ~540s of Drive upload retries + margin). Older than that = hung/dead.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/sweeper_heartbeat')<1800 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    # Primary PDF generator (WeasyPrint peaks ~2.5g at generation_concurrency=5); backstop only.
    mem_limit: 6g

volumes:
  narrative_cache:
  sweeper_narrative_cache:
  recovery:
